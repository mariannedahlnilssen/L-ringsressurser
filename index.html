<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demokrati – læringssti</title><style>body{font-family:Arial,sans-serif;background:#f5f7fa;color:#17243a;margin:0;line-height:1.6}main{max-width:760px;margin:auto;padding:22px}h1{font-size:2rem}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,.link{border:2px solid #b6c5d7;border-radius:12px;background:white;padding:12px 15px;font-size:1rem;cursor:pointer;color:#17243a}button:focus-visible,a:focus-visible{outline:3px solid #285bd4}button.active{background:#183f7a;color:white}.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 3px 14px #142d4517}.question{border-top:1px solid #ddd;padding:15px 0}.options{display:grid;gap:8px}.option{text-align:left}.correct{background:#d7f5df!important;border-color:#16713c!important;color:#113d25!important}.wrong{background:#ffe0df!important;border-color:#bb2525!important;color:#6d1414!important}.feedback{font-weight:bold;min-height:1.5em}.small{color:#536477}a{color:#164fa0}#progress{font-weight:bold}</style></head><body><main><h1>🏛️ Demokrati – fra Athen til 1814</h1><p>Se en kort film, les noen få setninger og trykk på riktig svar. Du kan prøve igjen når du vil.</p><p id="progress"></p><nav id="nav"></nav><section class="panel" id="content"></section></main><script>
const sections=[
{title:'1. Athen',summary:'For over 2000 år siden hadde Athen en form for demokrati. Frie menn som var borgere, kunne være med og bestemme. Kvinner, slaver og utlendinger hadde ikke stemmerett. Demokratiet gjaldt altså ikke alle.',film:'https://ndla.no/nb/r/historie-vg3/opplysningstid-og-revolusjoner-demokratiet-utvikles/ae5a69b3f1',qs:[['Hva betyr demokrati?',['At folket er med og bestemmer','At én konge bestemmer alt','At ingen har lover'],0,'Demokrati betyr folkestyre.'],['Hvem fikk delta i demokratiet i Athen?',['Alle som bodde der','Frie mannlige borgere','Bare kongen'],1,'Mange grupper var utestengt.'],['Hva er en forskjell mellom Athen og Norge i dag?',['I Norge kan også kvinner stemme','I Norge finnes ingen valg','I Athen stemte alle barn'],0,'Stemmeretten i Norge er mye bredere.']]},
{title:'2. Opplysningstiden',summary:'På 1700-tallet mente flere tenkere at mennesker hadde rettigheter, og at makten ikke burde samles hos én person. Montesquieu foreslo å dele makten. Rousseau mente at makten skulle komme fra folket.',film:'https://ndla.no/r/historie-pb/opplysningstidens-idegrunnlag/a3eb1ede91',qs:[['Hva ønsket opplysningstenkerne?',['Mer makt til én konge','At mennesker skulle bruke fornuft og ha rettigheter','At folk ikke skulle lære'],1,'Fornuft, frihet og rettigheter var viktige ideer.'],['Hva betyr maktfordeling?',['Å dele makten mellom ulike organer','Å gi all makt til én person','Å fjerne alle lover'],0,'Maktfordeling hindrer at én person bestemmer alt.'],['Hvem forbindes med maktfordeling?',['Montesquieu','Napoleon','Christian Frederik'],0,'Montesquieu er kjent for maktfordelingsprinsippet.']]},
{title:'3. Amerika',summary:'13 britiske kolonier i Nord-Amerika gjorde opprør mot Storbritannia. I 1776 erklærte de seg uavhengige. De ønsket å styre seg selv. Ideer om frihet og rettigheter ble viktige for den nye staten.',film:'https://ndla.no/nb/f/historie-vg3/82e3448dfdb8',qs:[['Hvem gjorde de amerikanske koloniene opprør mot?',['Frankrike','Storbritannia','Norge'],1,'Koloniene var styrt av Storbritannia.'],['Hva skjedde i 1776?',['Uavhengighetserklæringen ble vedtatt','Norges grunnlov ble skrevet','Den franske kongen ble avsatt'],0,'1776 er et viktig år i USAs historie.'],['Hva ønsket koloniene?',['Å bestemme mer selv','Å få en norsk konge','Å slutte å ha lover'],0,'De ønsket selvstyre.']]},
{title:'4. Frankrike',summary:'I 1789 begynte den franske revolusjonen. Mange var misfornøyde med kongens makt, forskjeller og urettferdighet. Slagordet ble frihet, likhet og brorskap. Revolusjonen førte også til vold og krig.',film:'https://ndla.no/nb/f/historie-vg3/82e3448dfdb8',qs:[['Når startet den franske revolusjonen?',['1814','1789','1905'],1,'Revolusjonen startet i 1789.'],['Hva var et kjent slagord?',['Frihet, likhet og brorskap','Konge, krig og skatt','Stillhet og lydighet'],0,'Frihet, likhet og brorskap.'],['Hvorfor gjorde mange opprør?',['De ønsket mer urettferdighet','De var misfornøyde med makt og ulikhet','De ville ha færre rettigheter'],1,'Ulikhet og kongens makt skapte misnøye.']]},
{title:'5. Norge 1814',summary:'I 1814 møttes 112 representanter på Eidsvoll. De skrev Norges grunnlov, som ble vedtatt 17. mai. Grunnloven bygde på ideer om folkesuverenitet, maktfordeling og rettigheter. Men ikke alle hadde stemmerett.',film:'https://ndla.no/en/r/historie-pb/1814-skjebnearet-for-norge/326c53b364',qs:[['Hvor ble Grunnloven skrevet?',['Eidsvoll','Athen','Paris'],0,'Representantene møttes på Eidsvoll.'],['Når ble Grunnloven vedtatt?',['4. juli 1776','17. mai 1814','14. juli 1789'],1,'Derfor feirer vi 17. mai.'],['Hvor mange representanter møttes på Eidsvoll?',['12','112','1000'],1,'Det var 112 representanter.'],['Hvilken idé påvirket Grunnloven?',['All makt til kongen','Maktfordeling','Ingen lover'],1,'Maktfordeling var en viktig idé.']]}
];let current=0;const answered={};function render(){document.getElementById('progress').textContent='Del '+(current+1)+' av '+sections.length;document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}</button>`).join('');const s=sections[current];document.getElementById('content').innerHTML=`<h2>${s.title}</h2><p>${s.summary}</p><p><a class="link" target="_blank" rel="noopener" href="${s.film}">▶ Åpne film og fagstoff</a></p><p class="small">Filmlenken åpnes i ny fane. Noen sider har også tekst.</p><h3>Test deg selv</h3>${s.qs.map((q,j)=>`<div class="question"><strong>${j+1}. ${q[0]}</strong><div class="options">${q[1].map((opt,k)=>`<button class="option" id="o-${j}-${k}" onclick="answer(${j},${k})">${opt}</button>`).join('')}</div><p class="feedback" id="f-${j}" aria-live="polite"></p></div>`).join('')}<button onclick="go(${(current+1)%sections.length})">${current===4?'Start på nytt':'Neste del →'}</button>`;Object.entries(answered).forEach(([key,val])=>{let [a,b]=key.split('-').map(Number);if(a===current)paint(b,val)})}function go(i){current=i;render();window.scrollTo(0,0)}function answer(j,k){answered[current+'-'+j]=k;paint(j,k)}function paint(j,k){const q=sections[current].qs[j];q[1].forEach((_,i)=>{let b=document.getElementById(`o-${j}-${i}`);b.classList.remove('correct','wrong');if(i===k)b.classList.add(k===q[2]?'correct':'wrong')});document.getElementById('f-'+j).textContent=k===q[2]?'✓ Riktig! '+q[3]:'Prøv igjen! Hint: '+q[3]}render();</script></body></html>
